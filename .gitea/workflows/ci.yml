name: Java Microservice CI

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Maven
        run: |
          apt-get update -qq
          apt-get install -y -qq maven

      - name: Build application
        run: mvn -B clean package

      - name: Run unit tests
        run: mvn -B test

      - name: Build Docker image
        run: docker build -t localhost:5000/java-microservice:${{ gitea.sha }} \
          -t localhost:5000/java-microservice:latest .

      - name: Login to private registry
        run: echo "MySecureReg@123" | docker login localhost:5000 -u sonu --password-stdin

      - name: Push Docker image
        run: |
          docker push localhost:5000/java-microservice:${{ gitea.sha }}
          docker push localhost:5000/java-microservice:latest

      - name: Install Git and yq
        run: |
          apt-get install -y -qq git
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update GitOps repository with new image tag
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config --global user.name "gitea-ci-bot"
          git config --global user.email "ci-bot@example.com"
          git clone http://sonu:${GITOPS_TOKEN}@host.docker.internal:3000/sonu/java-microservice-gitops.git gitops-repo
          cd gitops-repo
          yq -i '.image.tag = "${{ gitea.sha }}"' helm-chart/values.yaml
          git add helm-chart/values.yaml
          git commit -m "Update image tag to ${{ gitea.sha }} [ci-skip]" || echo "No changes to commit"
          git push origin main
